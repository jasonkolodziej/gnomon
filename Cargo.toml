[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/graph",
    "crates/fsm",
    "crates/sched",
    "crates/policy",
    "crates/consensus",
    "crates/api",
    "crates/ctl",
    "crates/agent",
    "crates/cli",
    "crates/top",
    "crates/sim",
]
# Built for wasm32 on its own (see its README), not with the workspace.
exclude = ["examples/policy-plugins"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
