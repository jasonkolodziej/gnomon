[package]
version.workspace = true
edition.workspace = true
license.workspace = true
name = "gnomon-agent"
description = "Node agent: CDI resource discovery, registration, heartbeats, job launch"
[dependencies]
gnomon-api = { path = "../api" }
gnomon-core = { path = "../core" }
tonic = "0.12"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
