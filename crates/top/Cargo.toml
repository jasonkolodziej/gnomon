[package]
version = "0.1.0"
edition = "2021"
name = "gnomon-top"
description = "gntop: live terminal Gantt chart of the cluster plan (running spans and backfill reservations per node)"
[dependencies]
gnomon-api = { path = "../api" }
tonic = "0.12"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
[[bin]]
name = "gntop"
path = "src/main.rs"
