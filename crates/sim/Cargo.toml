[package]
version = "0.1.0"
edition = "2021"
name = "gnomon-sim"
description = "Deterministic trace replay, counterfactual policy evaluation and shadow-mode tooling for Gnomon"

[dependencies]
gnomon-core = { path = "../core" }
gnomon-graph = { path = "../graph" }
gnomon-fsm = { path = "../fsm" }
gnomon-sched = { path = "../sched" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
