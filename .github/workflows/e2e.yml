name: End-to-end

# Runs the scheduler test kit (testkit/) against a real Gnomon controller and agents.
#
#   pull_request / push to main   Gnomon only, --quick (durations x0.25), all seven tests
#   schedule / workflow_dispatch  the same suite at full length against Gnomon AND a single-node
#                                 Slurm on the same runner, then testkit/compare.py side by side
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:
    inputs:
      slurm:
        description: "Also run the suite against a single-node Slurm and compare"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  shellcheck:
    name: ShellCheck (testkit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint test-kit scripts
        run: shellcheck -x testkit/*.sh testkit/jobs/*.sh

  gnomon:
    name: Test kit (Gnomon${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && ', full length' || ', quick' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GNOMON_CORES: "8"
      GNOMON_MEM_MB: "16384"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build controller, agent and CLI
        run: cargo build --release --locked -p gnomon-ctl -p gnomon-agent -p gnomon-cli

      - name: Start a local Gnomon cluster
        run: |
          echo "$PWD/target/release" >> "$GITHUB_PATH"
          GNOMON_BIN="$PWD/target/release" testkit/local-cluster.sh start

      - name: Run the test kit
        run: |
          quick=--quick
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then quick=; fi
          testkit/run.sh --backend gnomon $quick --burst 50

      - name: Stop the cluster
        if: always()
        run: testkit/local-cluster.sh stop

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Test kit — Gnomon"
            echo
            echo '| test | result | detail |'
            echo '|---|---|---|'
            awk -F'\t' '{printf "| %s | %s | %s |\n", $1, $2, $3}' testkit/out/current/summary.tsv
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testkit-gnomon
          path: |
            testkit/out/gnomon-*
            testkit/out/*.log
          if-no-files-found: ignore

  slurm:
    name: Test kit (single-node Slurm, full length)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.slurm)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SLURM_CORES: "8"
      SLURM_MEM_MB: "16384"
      SLURM_PARTITION: debug
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Slurm and munge
        run: sudo apt-get update -q && sudo apt-get install -y -q slurm-wlm munge

      - name: Start a single-node Slurm
        run: sudo -E testkit/slurm-local.sh start

      - name: Run the test kit
        run: testkit/run.sh --backend slurm --burst 50

      - name: Slurm logs
        if: failure()
        run: sudo tail -n 100 /var/log/slurm/slurmctld.log /var/log/slurm/slurmd.log || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testkit-slurm
          path: testkit/out/slurm-*
          if-no-files-found: ignore

  compare:
    name: Gnomon vs Slurm
    needs: [gnomon, slurm]
    if: always() && needs.gnomon.result != 'skipped' && needs.slurm.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          path: runs

      - name: Compare runs
        run: |
          g=$(find runs/testkit-gnomon -maxdepth 1 -type d -name 'gnomon-*' | head -1)
          s=$(find runs/testkit-slurm -maxdepth 1 -type d -name 'slurm-*' | head -1)
          python3 testkit/compare.py "$g" "$s" | tee comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: testkit-comparison
          path: comparison.md
