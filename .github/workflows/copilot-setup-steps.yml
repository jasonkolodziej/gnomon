name: "Copilot Setup Steps"

# Run the setup steps when they change (validates the workflow) and allow
# manual test runs from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # This job MUST be named `copilot-setup-steps` for the cloud agent to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Minimal permissions required for the setup steps below.
    # Copilot is granted its own token for its own operations.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # graphify CLI + MCP server, so the cloud agent can query the committed
      # knowledge graphs (see GRAPHIFY.md and .github/instructions/graphify.instructions.md).
      - name: Set up Python for graphify
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install graphify
        env:
          GRAPHIFY_VERSION: ${{ vars.GRAPHIFY_VERSION }}
        run: |
          python -m pip install --disable-pip-version-check "graphifyy[mcp]${GRAPHIFY_VERSION:+==${GRAPHIFY_VERSION}}"
          graphify --version

      # Rust toolchain + protoc so the agent can build and test the Cargo workspace
      # (gnomon-api compiles proto/gnomon.proto with tonic-build).
      - name: Install protoc
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - name: Fetch and build dependencies
        run: cargo build --workspace --all-targets --locked
