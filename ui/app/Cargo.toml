[package]
name = "gnomon-ui"
version = "0.5.0"
edition.workspace = true
license.workspace = true
description = "Gnomon's browser UI: a terminal-styled Rune app over gnomon-web's JSON and SSE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rune = { workspace = true }
gnomon-web-model = { path = "../../crates/web-model" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "EventSource", "MessageEvent", "Event", "Request", "RequestInit", "Response", "Headers", "console"] }
